<svg class="dg" viewBox="0 0 1312 556" width="1312" height="556" role="img" aria-labelledby="dg-arch-desktop-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="dg-arch-desktop-title">Architecture: people use the Next.js frontend, which signs them in with Supabase Auth and calls the NestJS API with a JWT. The API verifies the JWT against Supabase signing keys, queries Postgres through Drizzle and stores documents in Supabase Storage.</title>
