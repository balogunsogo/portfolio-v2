<text class="dg-name" x="16" y="286" font-size="16">People</text>
<text class="dg-desc" x="16" y="308" font-size="14">In a browser or on a</text>
<text class="dg-desc" x="16" y="329" font-size="14">phone</text>
<text class="dg-name" x="256" y="286" font-size="16">Frontend</text>
<text class="dg-desc" x="256" y="308" font-size="14">Next.js, React, TypeScript,</text>
<text class="dg-desc" x="256" y="329" font-size="14">SCSS Modules</text>
<text class="dg-name" x="576" y="142" font-size="16">API</text>
<text class="dg-desc" x="576" y="164" font-size="14">NestJS on Vercel. Validation,</text>
<text class="dg-desc" x="576" y="185" font-size="14">business rules and ownership</text>
<text class="dg-desc" x="576" y="207" font-size="14">checks live here.</text>
<text class="dg-name" x="1036" y="142" font-size="16">Auth</text>
<text class="dg-desc" x="1036" y="164" font-size="14">Email and password, Google OAuth.</text>
<text class="dg-desc" x="1036" y="185" font-size="14">Issues the session and its JWT.</text>
<text class="dg-name" x="1036" y="286" font-size="16">Postgres</text>
<text class="dg-desc" x="1036" y="308" font-size="14">Ten tables, each with Row Level Security</text>
<text class="dg-name" x="1036" y="430" font-size="16">Storage</text>
<text class="dg-desc" x="1036" y="452" font-size="14">Resumes, cover letters and other</text>
<text class="dg-desc" x="1036" y="473" font-size="14">documents</text>
<text class="dg-desc" x="1020" y="533" font-size="14">Supabase</text>
<text class="dg-desc" x="596.8" y="16" font-size="13">sign-in, Google OAuth, session</text>
<text class="dg-desc" x="465.41" y="292" font-size="13">REST + JWT</text>
<text class="dg-desc" x="845.77" y="148" font-size="13">verifies the JWT (JWKS)</text>
<text class="dg-desc" x="855.39" y="292" font-size="13">SQL through Drizzle</text>
<text class="dg-desc" x="869.98" y="436" font-size="13">document files</text>
