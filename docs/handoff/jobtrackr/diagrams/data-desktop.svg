<text class="dg-name" x="16" y="29" font-size="15">documents</text>
<text class="dg-desc" x="16" y="49" font-size="14">Resumes, letters and files, kept in</text>
<text class="dg-desc" x="16" y="70" font-size="14">Storage</text>
<text class="dg-name" x="367" y="29" font-size="15">application_documents</text>
<text class="dg-desc" x="367" y="49" font-size="14">Which document went out with which</text>
<text class="dg-desc" x="367" y="70" font-size="14">application</text>
<text class="dg-name" x="718" y="29" font-size="15">applications</text>
<text class="dg-desc" x="718" y="49" font-size="14">Role, company, status, source, priority,</text>
<text class="dg-desc" x="718" y="70" font-size="14">dates</text>
<text class="dg-name" x="1068" y="29" font-size="15">offers</text>
<text class="dg-desc" x="1068" y="49" font-size="14">The offer and its decision date. At most</text>
<text class="dg-desc" x="1068" y="70" font-size="14">one</text>
<text class="dg-name" x="367" y="237" font-size="15">application_activities</text>
<text class="dg-desc" x="367" y="257" font-size="14">The history: submissions, replies,</text>
<text class="dg-desc" x="367" y="278" font-size="14">status changes</text>
<text class="dg-name" x="718" y="237" font-size="15">next_actions</text>
<text class="dg-desc" x="718" y="257" font-size="14">What to do next and when. One</text>
<text class="dg-desc" x="718" y="278" font-size="14">pending at a time</text>
<text class="dg-name" x="1068" y="237" font-size="15">interviews</text>
<text class="dg-desc" x="1068" y="257" font-size="14">Stage, time and zone, meeting link,</text>
<text class="dg-desc" x="1068" y="278" font-size="14">outcome</text>
<text class="dg-name" x="367" y="445" font-size="15">interview_preparation_items</text>
<text class="dg-desc" x="367" y="465" font-size="14">The preparation checklist</text>
<text class="dg-name" x="718" y="445" font-size="15">interview_topics</text>
<text class="dg-desc" x="718" y="465" font-size="14">Topics to review before the stage</text>
<text class="dg-name" x="1068" y="445" font-size="15">interview_questions</text>
<text class="dg-desc" x="1068" y="465" font-size="14">Questions to ask the interviewer</text>
<text class="dg-desc" x="266.95" y="32" font-size="13">many to many</text>
<text class="dg-desc" x="976.77" y="32" font-size="13">zero or one</text>
<text class="dg-desc" x="0" y="225" font-size="16">Arrows point from a record to the</text>
<text class="dg-desc" x="0" y="248" font-size="16">records that belong to it.</text>
