<style>

@font-face{font-family:'IBM Plex Sans';src:url('../../../../../src/assets/fonts/ibm-plex-sans/plex-sans-latin-600.woff2') format('woff2');font-weight:600;font-style:normal}
*, ::before, ::after { box-sizing: border-box; }
html { overflow-x: hidden; }
body { margin: 0; background: #FAFAF8; color: #111110; font-family: 'PP Neue Montreal', 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizelegibility; }

/* Visual 04 */

/* Visual 05 */

/* CTA */
.cta__link { display: inline-flex; align-items: center; min-height: 44px; font-size: 28px; font-weight: 500; line-height: 1.1; letter-spacing: -0.022em; margin-left: -0.015em; }
/* Footer */
.foot { margin-top: auto; padding-top: 104px; display: flex; flex-direction: column; gap: 40px; }

.aside { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 16px; align-items: end; font-size: 15px; line-height: 1.4; }
.clock { position: relative; width: 88px; height: 88px; color: #65635D; }
.clock svg { display: block; width: 88px; height: 88px; fill: none; stroke-linecap: round; }
.clock__face { stroke: currentcolor; stroke-width: 1; }
.clock__readout { fill: currentcolor; font-size: 11px; text-anchor: middle; dominant-baseline: central; }
.clock__hand { stroke: #111110; stroke-width: 1; }

.clock__pivot { fill: #FAFAF8; stroke: #111110; stroke-width: 1; }
.clock__time { position: absolute; left: 23px; top: 44px; transform: translate(-50%, -50%); font-size: 11px; line-height: 1; white-space: nowrap; pointer-events: none; }
.links { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
.links a { display: inline-block; padding: 6px 0; }
.meta--head { margin-top: 16px; }
.ctrl--split { justify-content: space-between; }
.fill { display: block; width: 100%; height: 100%; object-fit: cover; }
.duo { margin-top: 32px; display: flex; flex-direction: column; gap: 12px; }
.duo__imgs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 12px; }

.pair { display: flex; flex-direction: column; gap: 12px; }
.halves { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 8px; font-size: 13px; line-height: 1.4; color: #65635D; }
.ab { margin-top: 32px; }
.ab__body { display: flex; flex-direction: column; gap: 4px; }
.ab__label { font-size: 15px; line-height: 1.4; color: #65635D; }
.ab__cap { margin-top: 4px; font-size: 15px; line-height: 1.45; color: #65635D; text-wrap: pretty; }

.i2stage { position: relative; width: 100%; height: 375px; overflow: hidden; background: #15120F; }

.i2ctrl { flex-direction: column; align-items: flex-start; justify-content: flex-start; }
.i2read { font-size: 15px; line-height: 1.4; color: #65635D; font-variant-numeric: proportional-nums; }
.i2say { margin-top: 8px; min-height: 63px; padding-bottom: 8px; font-size: 15px; line-height: 1.4; color: #111110; }
.i2say.is-off { visibility: hidden; }
/* Interactive 02: replica of DOJANG's compact touch controls (src/styles.css, main b34f80c). Values resolved for an
   iPhone SE in landscape: --edge-r 14px, --edge-b 10px, --bp-scale 0.88, --ctl-opacity 0.7. */
.djt { position: absolute; inset: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; -webkit-user-select: none; user-select: none; touch-action: none; }
.djt button { -webkit-appearance: none; appearance: none; margin: 0; padding: 0; font-family: inherit; line-height: normal; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.djt button:focus-visible { outline: 2px solid #FFFFFF; outline-offset: 2px; }
.djt__stickzone { position: absolute; left: 0; top: 24%; bottom: 0; width: 42%; border: 0; background: none; touch-action: none; }
.djt__base { position: absolute; left: 36px; top: 229px; width: 104px; height: 104px; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, 0.22); background: rgba(0, 0, 0, 0.1); pointer-events: none; opacity: 0.45; transition: opacity 120ms; transform: scale(0.9); }
.djt__base.is-active { opacity: 0.95; }
.djt__knob { position: absolute; left: 29px; top: 29px; width: 46px; height: 46px; border-radius: 50%; background: rgba(255, 255, 255, 0.42); }
.djt__cluster { position: absolute; right: 14px; bottom: 10px; width: 236px; height: 200px; transform: scale(0.88); transform-origin: bottom right; pointer-events: none; }
.djt__b { position: absolute; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(20, 16, 12, 0.32); border: 1.5px solid rgba(255, 255, 255, 0.24); color: rgba(255, 255, 255, 0.82); pointer-events: auto; touch-action: none; font-size: 11px; font-weight: 700; letter-spacing: 0.02em; opacity: 0.7; transition: transform 60ms, background 60ms; }
.djt__b .s { font-size: 8px; font-weight: 500; opacity: 0.65; }
.djt__b.is-down { transform: scale(0.93); background: rgba(232, 195, 74, 0.5); border-color: #E8C34A; color: #FFFFFF; opacity: 1; }
.djt__b--chip { border-radius: 14px; height: 30px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
.djt__b--chip.is-on { background: rgba(232, 195, 74, 0.75); color: #16130F; border-color: #E8C34A; }
.djt__kick { right: 0; bottom: 0; width: 84px; height: 84px; font-size: 13px; background: rgba(122, 43, 31, 0.42); border-color: rgba(255, 190, 150, 0.45); }
.djt__kick.is-head { box-shadow: 0 0 0 3px rgba(232, 195, 74, 0.6); }
.djt__arc { position: absolute; inset: -7px; border-radius: 50%; border: 2px dashed rgba(255, 255, 255, 0.16); border-right-color: transparent; border-bottom-color: transparent; transform: rotate(-45deg); pointer-events: none; }
.djt__guard { right: 98px; bottom: 2px; width: 64px; height: 64px; border-color: rgba(143, 178, 255, 0.45); }
.djt__dash { right: 6px; bottom: 100px; width: 50px; height: 50px; }
.djt__punch { right: 176px; bottom: 6px; width: 50px; height: 50px; }
.djt__switch { right: 172px; bottom: 70px; width: 44px; height: 44px; font-size: 15px; }
.djt__high { right: 76px; bottom: 98px; width: 64px; }
.djt__cluster.is-open .djt__b:not(.djt__kick) { opacity: 0.12; }
.djt__wheel { position: absolute; right: 42px; bottom: 42px; width: 0; height: 0; pointer-events: none; z-index: 2; }
.djt__ring { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); border-radius: 50%; }
.djt__ring--head { width: 320px; height: 320px; border: 1.5px dashed rgba(232, 195, 74, 0.45); }
.djt__ring--lead { width: 172px; height: 172px; border: 1px solid rgba(143, 220, 190, 0.35); background: rgba(20, 40, 32, 0.25); }
.djt__item { position: absolute; left: -28px; top: -28px; width: 56px; height: 56px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(20, 16, 12, 0.72); border: 1.5px solid rgba(255, 255, 255, 0.35); color: #FFFFFF; font-size: 12px; font-weight: 700; }
.djt__item .s { font-size: 8px; opacity: 0.7; }
.djt__item--lead { left: -23px; top: -23px; width: 46px; height: 46px; font-size: 10px; border-color: rgba(143, 220, 190, 0.6); }
.djt__item.is-sel { border-color: rgba(255, 190, 150, 0.8); }
.djt__item.is-on { background: rgba(232, 195, 74, 0.85); color: #16130F; border-color: #E8C34A; }
.djt__item.djt__item--lead.is-on { background: rgba(143, 220, 190, 0.9); border-color: #8FDCBE; }
.djt__item.is-on.is-head { background: #F4E27A; box-shadow: 0 0 0 4px rgba(232, 195, 74, 0.5); }
.djt__t { position: absolute; top: 40px; width: 32px; height: 32px; border-radius: 50%; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.18); font-size: 12px; color: rgba(255, 255, 255, 0.8); }
.djt__t--pause { left: 14px; }
.djt__t--lock { right: 14px; }

</style>

<div style="width: 390px; padding: 24px 20px; background: #FAFAF8"><figure class="demo" style="margin-top: 0" aria-label="DOJANG’s touch controls, the first layout and the compact one"><div class="vplate"><div class="i2stage" data-stage=""><div class="i2screen" data-screen=""><img class="i2shot" src="../../../../../src/assets/images/writing/dojang-touch-frame.webp" alt="A frame from the current build on an iPhone SE-sized screen, with the scoreboard across the top and the two fighters squaring up." width="667" height="375" decoding="async"/><div class="djt" data-touch=""><button class="djt__stickzone" type="button" aria-label="Joystick: move"></button><div class="djt__base" style="left: 36px; top: 229px"><div class="djt__knob" style="transform: translate(0px, 0px)"></div></div><div class="djt__cluster"><button class="djt__b djt__kick" type="button" aria-label="Kick: . Hold or slide for the wheel."><span class="l">Round</span><span class="s">Dollyeo</span><span class="djt__arc" aria-hidden="true"></span></button><button class="djt__b djt__guard is-down" type="button" aria-label="Guard"><span class="l">Guard</span></button><button class="djt__b djt__dash" type="button" aria-label="Dash"><span class="l">Dash</span></button><button class="djt__b djt__punch" type="button" aria-label="Punch"><span class="l">Punch</span></button><button class="djt__b djt__switch" type="button" aria-label="Switch stance"><span class="l">⇄</span></button><button class="djt__b djt__b--chip djt__high" type="button" aria-label="Target height" aria-pressed="false"><span class="l">Body</span></button></div><button class="djt__t djt__t--pause" type="button" aria-label="Pause">❚❚</button><button class="djt__t djt__t--lock" type="button" aria-label="Lock-on">◎</button></div></div></div><div class="ctrl i2ctrl"><div class="group" role="group" aria-label="Layout"><button class="opt" type="button" aria-pressed="false">First layout</button><button class="opt is-on" type="button" aria-pressed="true">Compact layout</button></div><p class="i2read">Covers 17.6% of the screen</p></div><p class="i2say" aria-live="polite">Guarding while you hold Guard. On a keyboard: hold Space.</p></div><figcaption class="row"><p class="cap">The compact layout on the same screen. The controls are a working copy built from DOJANG’s own layout and styles, over a frame from the current build captured on 14 November 2026. Coverage is the share of the screen under the scoreboard and controls, measured the same way for both. On a phone, the figure shows the right side of the screen at its real size.</p></figcaption></figure></div>
